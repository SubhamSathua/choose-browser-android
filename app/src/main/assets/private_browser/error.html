<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/png" href="src/icon/error.png">
<title>Page Not Available</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f1f3;--card:#fff;--text:#000;--sub:#575757;--accent:#377aff}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e20;--card:#252527;--text:#e4e6eb;--sub:#b0b3b8}}
html.dark{--bg:#1e1e20;--card:#252527;--text:#e4e6eb;--sub:#b0b3b8}
@font-face{font-family:'Inter';src:url('../src/inter_regular.ttf')}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:var(--card);border-radius:20px;padding:32px 24px;max-width:380px;width:100%;text-align:center}
.icon{font-size:48px;margin-bottom:16px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
h1{font-size:20px;margin-bottom:8px;font-weight:600}
.error-code{font-size:12px;color:var(--sub);background:rgba(128,128,128,.1);display:inline-block;padding:4px 12px;border-radius:8px;margin-bottom:16px;font-family:monospace}
p{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:20px}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 32px;border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;cursor:pointer}
.btn:active{opacity:.7}
.tips{margin-top:24px;text-align:left;border-radius:12px;padding:16px;background:rgba(128,128,128,.06)}
.tips h2{font-size:13px;margin-bottom:10px;color:var(--text)}
.tips li{font-size:12px;color:var(--sub);margin-bottom:6px;margin-left:16px}
</style>
</head>
<body>
<div class="card">
<div class="icon">🔌</div>
<h1>Can't reach this page</h1>
<div class="error-code" id="errorCode">NET_ERROR</div>
<p id="errorDesc">The page failed to load. Check your connection and try again.</p>
<button class="btn" onclick="retry()">Retry</button>
<div class="tips">
<h2>Things to try:</h2>
<ul>
<li>Check your internet connection</li>
<li>Make sure the URL is correct</li>
<li>Try disabling ad/tracker blocking</li>
<li>The site may be temporarily down</li>
<li>Try enabling JavaScript</li>
</ul>
</div>
</div>
<script>
(function(){
var p=new URLSearchParams(window.location.search);
if(p.get('theme')==='dark')document.documentElement.classList.add('dark');
var c=p.get('code'),d=p.get('desc');
if(c)document.getElementById('errorCode').textContent=c;
if(d)document.getElementById('errorDesc').textContent=d;
})();
function retry(){try{if(window.Android&&Android.retry)Android.retry();else location.reload()}catch(e){location.reload()}}
</script>
</body>
</html>
