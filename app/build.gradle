plugins {
    alias(libs.plugins.android.application)
}

// ── Auto-incrementing version ─────────────────────────────────────────────
// Format: <MAJOR>.<XX>.<SUB>  e.g.  4.01.7
// SUB counts 1→14, then resets to 1 and XX increments.
// versionCode = MAJOR*10000 + XX*100 + SUB  (always a unique integer).
// Edit VERSION_MAJOR manually in version.properties to bump the major number.
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def vMajor = (versionProps['VERSION_MAJOR'] ?: '4').toInteger()
def vX     = (versionProps['VERSION_X']     ?: '1').toInteger()
def vSub   = (versionProps['VERSION_SUB']   ?: '1').toInteger()

def computedVersionName = "${vMajor}.${String.format('%02d', vX)}.${vSub}"
// Base offset ensures this is always higher than old date-based codes (max was ~26030823)
def computedVersionCode = 26031000 + vMajor * 10000 + vX * 100 + vSub

// Only increment when actually assembling (not on IDE sync / Gradle sync)
def assembling = gradle.startParameter.taskNames.any { name ->
    name.toLowerCase().contains('assemble')
}
if (assembling) {
    def nextSub = vSub + 1
    def nextX   = vX
    if (nextSub > 14) { nextSub = 1; nextX = vX + 1 }
    versionProps['VERSION_MAJOR'] = vMajor.toString()
    versionProps['VERSION_X']     = nextX.toString()
    versionProps['VERSION_SUB']   = nextSub.toString()
    versionPropsFile.withWriter { versionProps.store(it, null) }
}
// ─────────────────────────────────────────────────────────────────────────

// Load keystore credentials from key.properties or environment variables (CI/CD)
def keystorePropsFile = rootProject.file("key.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.hyper.choosebrowsernew'
    compileSdk 34

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    defaultConfig {
        applicationId "org.prism.choosebrowser"
        minSdk 27
        targetSdk 34
        versionCode computedVersionCode
        versionName computedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                println "========================================"
                println "FOUND KEY PROPERTIES! Loading keys..."
                println "Keystore File: " + (keystoreProps['storeFile'] ?: 'release.jks')
                println "Key Alias: " + keystoreProps['keyAlias']
                println "========================================"

                storeFile rootProject.file(keystoreProps['storeFile'] ?: 'release.jks')
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            } else {
                println "========================================"
                println "WARNING: key.properties NOT FOUND!"
                println "========================================"
            }
        }
    }

    buildTypes {
        release {
            // MUST be present so Gradle signs the release APK
            signingConfig signingConfigs.release

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        alpha {
            initWith release
            applicationIdSuffix ".alpha"
            resValue "string", "app_name", "Choose Browser Alpha"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation libs.appcompat
    implementation "com.google.android.material:material:1.9.0"
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

}