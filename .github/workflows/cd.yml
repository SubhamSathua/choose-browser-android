name: Android CI/CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 1. Build release APKs (unsigned)
      - name: Build APKs
        run: ./gradlew assembleRelease

      # 2. Decode the Base64 Keystore into a file
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # 3. Sign all generated APKs using native apksigner
      - name: Sign APKs
        run: |
          ANDROID_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Signing $apk..."
            $ANDROID_BUILD_TOOLS/apksigner sign \
              --ks release.jks \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              "$apk"
          done

      # 4. Check if this is an Alpha/Pre-release tag
      - name: Check Release Type
        id: check_type
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-alpha"* ]] || [[ "$TAG_NAME" == *"-pre"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      # 5. Publish Signed APKs to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
