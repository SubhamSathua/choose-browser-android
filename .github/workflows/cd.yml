name: Android CI/CD

on:
  push:
    tags:
      - 'v*'

# Grant write permissions for creating GitHub Releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 1. Decode Keystore to a file in the workspace
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # 2. Determine Build Variant and Release Type based on Tag Name
      - name: Determine Build Variant
        id: build_variant
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-alpha"* ]] || [[ "$TAG_NAME" == *"-pre"* ]]; then
            echo "BUILD_TASK=assembleAlpha" >> $GITHUB_ENV
            echo "APK_PATH=app/build/outputs/apk/alpha/*.apk" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "Building Alpha Pre-release variant for tag: $TAG_NAME"
          else
            echo "BUILD_TASK=assembleRelease" >> $GITHUB_ENV
            echo "APK_PATH=app/build/outputs/apk/release/*.apk" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "Building Production Release variant for tag: $TAG_NAME"
          fi

      # 3. Build Signed APKs via Gradle using Environment Variables
      - name: Build Signed APKs
        env:
          KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew ${{ env.BUILD_TASK }}

      # 4. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
